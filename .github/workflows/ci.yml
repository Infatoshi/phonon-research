name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    # Lint only scripts/, which is ruff-clean today; ml/ and tools/ are not, and are left as they ran.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --with ruff ruff check scripts
