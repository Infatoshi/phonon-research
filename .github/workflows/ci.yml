name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    # Lint scripts/ and the notebook's local helper tools/voice_pack.py, which are ruff-clean; the rest of ml/ and
    # tools/ is not, and is left as it ran.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --with ruff ruff check scripts tools/voice_pack.py
